name: Fire TV Player APK
on:
  push:
    branches: [main]
    paths:
      - 'fire-tv-player/**'
      - '.github/workflows/fire-tv-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: fire-tv-player
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Jukebox-FireTV-APK
          path: fire-tv-player/app/build/outputs/apk/debug/app-debug.apk
