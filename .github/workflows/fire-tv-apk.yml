name: Fire TV Player APK
on:
  push:
    branches: [main]
    paths:
      - 'fire-tv-player/**'
      - '.github/workflows/fire-tv-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools missing; installing them"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/android-cli
            unzip -q /tmp/commandlinetools.zip -d /tmp/android-cli
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R /tmp/android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: fire-tv-player
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Jukebox-FireTV-APK
          path: fire-tv-player/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp fire-tv-player/app/build/outputs/apk/debug/app-debug.apk YT-Music-Jukebox-FireTV.apk
          if gh release view fire-tv-latest >/dev/null 2>&1; then
            gh release upload fire-tv-latest YT-Music-Jukebox-FireTV.apk --clobber
          else
            gh release create fire-tv-latest YT-Music-Jukebox-FireTV.apk --title "Fire TV Player (latest)" --notes "Direct-install APK for Fire TV Downloader. Built from the main branch." --latest=false
          fi
