services:
  jukebox:
    build: .
    image: yt-music-jukebox:dev
    container_name: yt-music-jukebox
    ports:
      - "3035:3000"
    volumes:
      - /mnt/user/appdata/yt-music-jukebox:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN to a random secret of at least 16 characters}
    restart: unless-stopped
