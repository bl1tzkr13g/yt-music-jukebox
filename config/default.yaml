server:
  port: 3000
  access: lan
youtube:
  default_playlist_name: My Country Music Mix
  default_playlist_url: ""
  shuffle: true
requests:
  enabled: true
  max_pending_per_guest: 3
  duplicate_cooldown_minutes: 60
  max_video_minutes: 8
  queue_mode: round_robin
filters:
  non_music:
    enabled: true
    action: flag
  explicit:
    enabled: true
    unknown: reject
  genres:
    enabled: false
    allowed: []
    blocked: []
    unknown: reject
chat:
  enabled: true
  mode: both
  max_length: 240
  cooldown_seconds: 5
  max_messages: 100
  profanity:
    enabled: true
    action: mask
    replacement: "***"
    extra_words: []
    allow_words: []
player:
  theme:
    background: "#850019"
    panel: "#ffffff"
    text: "#151515"
  sidebar_percent: 28
  show_queue: true
  show_qr_code: true
  show_comments: true
  show_requester: true
  compact_queue: false
  video_mode: video

playback:
  prefer_music_video: true
  allow_lyric_video: true
  allow_audio_only: true
  auto_find_alternative: true
  skip_unplayable: true
  max_alternative_attempts: 6
